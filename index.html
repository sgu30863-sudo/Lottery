<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ထီနံပါတ်များ</title>
<style>
:root{--bg:#fafafa;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--line:#e2e2e6;--acc:#c2185b}
@media (prefers-color-scheme: dark){:root{--bg:#17171a;--fg:#f2f2f4;--mut:#9a9aa2;--card:#222226;--line:#34343a;--acc:#f06292}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:4px 0}.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.bar{margin:10px 0;font-size:14px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
button.n{font:600 17px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--acc);cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:30px 0}
#m{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px}
#m.on{display:flex}#mb{max-width:820px;width:100%;text-align:center}
#m img{width:100%;border-radius:10px;background:#fff}
#m p{color:#fff;font:600 18px ui-monospace,Menlo,monospace;margin:0 0 10px}
#m small{color:#ddd;display:block;margin-top:10px}
</style></head><body><div class="wrap">
<h1>ထီနံပါတ်များ</h1>
<p class="sub">ထီပွင့်မယ့်ရက် ၁ နိုဝင်ဘာ ၂၀၂၆ · နံပါတ်ကို နှိပ်ရင် ထီပုံပေါ်ပါမယ်</p>
<input id="q" inputmode="numeric" placeholder="နံပါတ်ရှာရန် (ဥပမာ 0138)">
<div class="bar" id="cnt">ဖတ်နေသည်…</div>
<div class="grid" id="g"></div><div class="empty" id="e" hidden>မတွေ့ပါ</div></div>
<div id="m"><div id="mb"><p id="mn"></p><img id="mi" alt="ထီ"><small>ပိတ်ရန် ဘယ်နေရာမဆို နှိပ်ပါ</small></div></div>
<script>
// ===== ဒီတစ်ကြောင်းတည်းကိုပဲ ပြင်ပါ: Apps Script Web App URL =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzVgwWDoXCJhFJVVGA9Z2OpjI5cHNu_pSLkTcb_ooVZ6wvPeWV2PZapORrWImEOK_fN/exec';
// =====================================================
const $=id=>document.getElementById(id);
let list=[];
function draw(){const t=$('q').value.trim(),g=$('g');g.innerHTML='';let c=0;
 list.forEach(n=>{if(t&&!n.includes(t))return;c++;const b=document.createElement('button');b.className='n';b.textContent=n;
  b.onclick=()=>{$('mn').textContent=n;$('mi').src='img/'+n+'.jpg';$('m').classList.add('on')};g.appendChild(b)});
 $('e').hidden=c>0||!list.length;$('cnt').textContent='ကျန် '+list.length+' ရွက်'}
async function load(){
 try{const r=await fetch(API_URL);const d=await r.json();list=d.numbers||[];
  try{localStorage.setItem('cache',JSON.stringify(list))}catch(e){}}
 catch(e){try{list=JSON.parse(localStorage.getItem('cache')||'[]')}catch(x){}
  if(!list.length)$('cnt').textContent='ဖတ်မရပါ - API_URL ကို စစ်ပါ'}
 draw()}
$('q').oninput=draw;$('m').onclick=()=>$('m').classList.remove('on');
try{list=JSON.parse(localStorage.getItem('cache')||'[]');draw()}catch(e){}
load();setInterval(load,60000);
</script></body></html>
